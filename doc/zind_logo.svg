<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Frame -->
  <rect x="50" y="50" width="1100" height="300" rx="30" fill="none" stroke="#f7a41d" stroke-width="4" />
  
  <!-- Text Block (Centered with proper vertical/horizontal breathing room) -->
  <g font-family="'JetBrains Mono', monospace" font-weight="bold" text-anchor="middle">
    
    <!-- 1. Shadow of the Edge (Creates the 'wall' depth) -->
    <text x="608" y="253" font-size="210" fill="none" stroke="black" stroke-width="12" letter-spacing="10">Zind</text>
    
    <!-- 2. The Main Floating Edge (Orange Outline) -->
    <text x="600" y="245" font-size="210" fill="none" stroke="#f7a41d" stroke-width="12" letter-spacing="10">Zind</text>
    
    <!-- 3. The Recessed Interior (Hollow look) -->
    <!-- fill="none" ensuring no 'brown' artifacts; showing website background instead -->
    <text x="600" y="245" font-size="210" fill="none" letter-spacing="10">Zind</text>

    <!-- Subtitle (Positioned closer to Zind, with expanded readability) -->
    <text x="600" y="320" font-size="45" fill="#ffffff" letter-spacing="4">Zig Structural API Indexer</text>
  </g>
</svg>
